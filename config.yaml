listener:
  push_to_talk_key: "ctrl+`"
  sample_rate: 16000
  silence_timeout_sec: 0.7
  max_record_sec: 15
  clap_detection:
    threshold: 0.08        # Audio peak level to count as a clap (lower = more sensitive)
    min_gap_sec: 0.1       # Minimum time between two claps
    max_gap_sec: 1.0       # Maximum time between two claps

transcriber:
  # backend: "remote" sends the clip to an OpenAI-compatible transcription
  # endpoint; "local" always uses faster-whisper below. Remote falls back to
  # local automatically on any error, so this is a latency choice, not a
  # single point of failure. Measured on identical clips, 2026-08-19:
  #   remote  whisper-large-v3-turbo (Groq)   287ms median
  #   local   distil-small.en (CUDA)         1316ms median
  # Same words out of both. NOTE this sends microphone audio off the machine.
  backend: "remote"           # "remote" | "local"
  remote_model: "whisper-large-v3-turbo"
  base_url: "https://api.groq.com/openai/v1"
  api_key_env: "GROQ_API_KEY"
  timeout_sec: 10
  # Local model, used when backend is "local" and as the remote fallback.
  # distil-small.en is faster and lighter than base.en; requires ~1 GB VRAM.
  # Fall back to "base.en" if distil-small.en is unavailable on your system.
  model_size: "distil-small.en"
  device: "cuda"          # use "cpu" if no CUDA-capable GPU
  compute_type: "float16" # float16 on GPU, int8 on CPU

llm:
  # Local by default (NORA_ODYSSEUS_PLAN.md §2.4 — the highest-value privacy
  # change here: every voice command used to leave the machine as text to
  # Groq. qwen3:8b + Ollama's schema-constrained decoding keeps intent
  # parsing on-device with equal reliability). GPU-accelerated via the GTX
  # 1650 (partial offload — the 8B model doesn't fully fit in 4GB VRAM, but
  # Ollama splits GPU/CPU automatically). Flip back to "groq" if Ollama
  # isn't running.
  # 2026-08-19: moved back to Groq. qwen3:8b is 5.2 GB against 4 GB of VRAM on
  # the GTX 1650, so Ollama offloads a large slice to CPU — with the full
  # command catalogue in the system prompt and schema-constrained decoding on
  # top, intent parsing was exceeding the 45s timeout. Measured on Groq:
  # gpt-oss-120b parses "what do you see on my screen" in ~2.1s and picks the
  # right action; gpt-oss-20b answers in ~0.9s but chose ask_claude for the
  # same utterance, so the larger model earns its extra second here.
  #
  # NOTE this reverses the privacy posture described above — voice commands
  # now leave the machine as text again. To go back to on-device parsing,
  # restore the two commented lines below AND pull a model that fits in 4 GB
  # (`ollama pull qwen2.5:3b`); qwen3:8b does not.
  provider: "groq"            # "groq" | "claude" | "ollama"
  model: "openai/gpt-oss-120b"
  base_url: "http://localhost:11434"
  # Local rollback, kept for quick switching:
  # provider: "ollama"
  # model: "qwen3:8b"
  # Any OpenAI-compatible free endpoint (OpenRouter, Cerebras) works via
  # api_base + api_key_env below.
  # api_base: "https://openrouter.ai/api/v1"
  # api_key_env: "OPENROUTER_API_KEY"
  json_mode: true             # Enforced JSON responses on groq/OpenAI-compatible endpoints
  structured_output: true     # Ollama: constrain decoding to the intent schema (needs Ollama >= 0.5)
  temperature: 0.1
  max_tokens: 512

llm_router:
  # Adaptive multi-provider routing (nora/model_router.py, NORA_ODYSSEUS_PLAN.md
  # Part 2 + §4.7). Each role is an ORDERED candidate chain — first one not in
  # rate-limit cooldown wins. A 429 sends that candidate to cooldown (parses
  # Retry-After when the provider sends one, else a 90s default) and the
  # router falls through to the next candidate instead of failing the caller.
  # Every attempt is logged to nora_model_router_log.jsonl (provider-per-request
  # audit trail — see NORA_ODYSSEUS_PLAN.md §3).
  #
  # "local" candidates need Ollama running with the model pulled
  # (`ollama pull qwen3:8b`) — harmless to leave configured before that's
  # done, the router just logs a connection error and falls through.
  roles:
    # Cloud-only as of 2026-08-19. The local candidate (qwen3:8b, 5.2 GB) does
    # not fit the GTX 1650's 4 GB and was timing out under real prompt sizes,
    # so it is no longer a credible fallback. Measured on this machine:
    #   groq   openai/gpt-oss-120b                 ~1.2-2.1s   best judgement
    #   groq   openai/gpt-oss-20b                  ~0.5s
    #   nvidia nvidia/nemotron-3-nano-30b-a3b      ~1.3s
    #   nvidia nvidia/nemotron-3-super-120b-a12b   ~15.9s      too slow
    #   nvidia meta/llama-3.3-70b-instruct         timed out
    # Both Groq entries share one key and one host, so a Groq outage takes out
    # both — the NVIDIA candidate is last in every chain precisely because it
    # is the only one that survives that.
    intent:
      - name: groq_gpt_oss_120b
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "openai/gpt-oss-120b"
      - name: groq_gpt_oss_20b
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "openai/gpt-oss-20b"
      # Last resort only, and genuinely degraded — measured against the full
      # intent prompt, NOT a peer of the two above:
      #   nvidia/nemotron-3-nano-30b-a3b   19.1s, returned zero steps
      #   meta/llama-3.1-8b-instruct        5.9s, invented "list_active_apps"
      #                                     which is not a registered action
      #   meta/llama-3.3-70b-instruct       timed out
      # The big system prompt (full command catalogue) is what hurts them; the
      # same models answer a one-line chat prompt in ~1.3s. Kept because if
      # Groq is down entirely, a wrong-but-occasionally-right plan beats NORA
      # being unable to act at all — the fast path still covers common
      # commands, and unknown actions fail loudly rather than silently.
      - name: nvidia_llama31_8b
        provider: nvidia
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key_env: "NVIDIA_API_KEY"
        model: "meta/llama-3.1-8b-instruct"

    chat:
      - name: groq_gpt_oss_120b
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "openai/gpt-oss-120b"
        extra_body:
          # Without this Groq appends gpt-oss's analysis channel to
          # `content`, and NORA reads its own scratchpad out loud.
          reasoning_format: "hidden"
      - name: groq_gpt_oss_20b
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "openai/gpt-oss-20b"
        extra_body:
          reasoning_format: "hidden"
      - name: nvidia_nemotron_nano_30b
        provider: nvidia
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key_env: "NVIDIA_API_KEY"
        model: "nvidia/nemotron-3-nano-30b-a3b"
        extra_body:
          # Nemotron is a hybrid-reasoning model. It normally returns its
          # scratchpad in a separate `reasoning_content` field, but when the
          # thinking runs long it overflows into `content` too — and NORA reads
          # it aloud ("We need to recall what we previously told the user...").
          # This is the NVIDIA equivalent of Groq's reasoning_format:"hidden".
          chat_template_kwargs:
            thinking: false

    live_search:
      # Live web search (nora/commands/web_search.py). groq/compound-mini is an
      # agentic model with a SERVER-SIDE search tool: it runs its own queries,
      # reads the results and answers from them, so this is the only role that
      # can answer "what's happening right now" truthfully. The searches it ran
      # come back as `executed_tools` and are logged as source URLs.
      #
      # Measured on this machine, 2026-08-19:
      #   groq/compound-mini   ~2-7s, ~7.5k prompt tokens per call
      #   groq/compound        413 Request Entity Too Large on the free tier
      # compound-mini is backed by openai/gpt-oss-120b and inherits its 8k TPM
      # free-tier budget, so a single call sits close to the ceiling: keep
      # max_tokens small (web_search asks for 180) or the request itself is
      # rejected with 413, and expect intermittent 429s while intent parsing is
      # using the same bucket. Both are fall-through, not failure — web_search
      # drops to the Brave/DDG snippet path below.
      - name: groq_compound_mini
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "groq/compound-mini"

    research:
      # Summarises Brave/DDG search snippets into a spoken answer — the
      # fallback path when live_search is unavailable. Plain chat models; the
      # facts come from the snippets, not the weights.
      #
      # reasoning_effort:"low" matters here. gpt-oss spends its completion
      # budget on hidden reasoning first, so at default effort a 2-sentence
      # answer gets truncated mid-word ("Petrol in Bangalore is Rs 111.68
      # per") and the TTS reads the stump. Low effort drops that to a handful
      # of tokens — this task is "read these snippets", not a thinking task.
      - name: groq_gpt_oss_120b
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "openai/gpt-oss-120b"
        extra_body:
          reasoning_format: "hidden"
          reasoning_effort: "low"
      - name: groq_gpt_oss_20b
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "openai/gpt-oss-20b"
        extra_body:
          reasoning_format: "hidden"
          reasoning_effort: "low"
      - name: nvidia_nemotron_nano_30b
        provider: nvidia
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key_env: "NVIDIA_API_KEY"
        model: "nvidia/nemotron-3-nano-30b-a3b"
        extra_body:
          # Nemotron is a hybrid-reasoning model. It normally returns its
          # scratchpad in a separate `reasoning_content` field, but when the
          # thinking runs long it overflows into `content` too — and NORA reads
          # it aloud ("We need to recall what we previously told the user...").
          # This is the NVIDIA equivalent of Groq's reasoning_format:"hidden".
          chat_template_kwargs:
            thinking: false

    reasoning:
      # Latency matters less here — this role is for deliberate thinking, not
      # for holding a conversation — so the slower, stronger model leads.
      - name: nvidia_nemotron_super_120b
        provider: nvidia
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key_env: "NVIDIA_API_KEY"
        model: "nvidia/nemotron-3-super-120b-a12b"
      - name: groq_gpt_oss_120b
        provider: groq
        base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"
        model: "openai/gpt-oss-120b"
        extra_body:
          reasoning_format: "hidden"
      - name: nvidia_nemotron_nano_30b
        provider: nvidia
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key_env: "NVIDIA_API_KEY"
        model: "nvidia/nemotron-3-nano-30b-a3b"

speaker:
  voice: "en-GB-SoniaNeural"   # British female — NORA's voice (used by edge-tts fallback)
  rate: "+20%"                  # Faster than default. Try "+30%" or "+40%" if you want snappier
  backend: "kokoro"             # "edge" (cloud) | "kokoro" (fully local, see STACK.md) — removes the Microsoft edge-tts network call
  kokoro:
    model_path: "~/models/kokoro-v1.0.onnx"
    voices_path: "~/models/voices-v1.0.bin"
    voice: "bf_emma"          # British female, closest to Sonia

conversation:
  # Dedicated conversational path (nora/conversation.py). Chat turns used to be
  # squeezed out of the JSON action-planner prompt at temperature 0.1 with a
  # hard "1-2 sentences maximum" cap, which is why replies sounded clipped and
  # canned. They now get their own speech-shaped prompt, real multi-turn
  # history (nora/dialogue.py), and the llm_router "chat" role — i.e. the 70B
  # model, with local fallback — at a warmer temperature.
  #
  # Set enabled:false to send every utterance back through the intent parser.
  enabled: true
  temperature: 0.7      # warm enough to vary phrasing between turns
  history_turns: 12     # user+NORA turns fed back into each chat call
  max_sentences: 6      # hard ceiling after shaping; per-act guidance is softer
  timeout_sec: 20
  # max_tokens: 240     # omit to use the per-dialogue-act budget

ack:
  # Acknowledgement tokens ("Mm-hm.", "One sec.") — the filler that covers the
  # gap between you finishing and NORA answering (nora/ack.py).
  #
  # These used to synthesize at "+40%" on top of the speaker's "+20%", which
  # compounded to a clipped, chipmunky delivery, and they fired on *every*
  # utterance. Both are fixed: acks are now slower than normal speech (that's
  # how people actually say them) and are deferred — scheduled `delay_sec` out
  # and cancelled the instant real speech starts. On a fast command you hear
  # nothing but the answer. Set enabled:false to drop them entirely.
  enabled: true
  rate: "-10%"        # relative to TTS baseline — negative on purpose
  volume: 0.55        # quieter than the main voice
  delay_sec: 0.55     # only heard when the response is genuinely slow
  cooldown_sec: 6.0   # minimum gap between two audible acks
  # phrases: ["Mm-hm.", "Mm.", "Sure.", "Okay.", "Right.", "One sec."]

music:
  # Length of the wake-word entrance clip played from sounds/ on startup.
  # Set to 0 to play that clip in full.
  #
  # This caps ONLY the entrance flourish. Songs you ask for by name always play
  # in full — a request is not a preview.
  wake_playback_limit_seconds: 40

spotify:
  # Spotify is NORA's only music backend on Linux.
  #
  # Playback, transport, volume, shuffle and repeat all run over MPRIS D-Bus
  # against the local desktop client — those need no credentials at all.
  #
  # Credentials are only needed to turn a *name* into a track ("play blinding
  # lights"). That uses the client-credentials grant: no user login, no browser
  # redirect, and no Spotify Premium, because the local client does the playing.
  #
  # Create an app at https://developer.spotify.com/dashboard (no redirect URI
  # required), then put the pair in .env:
  #     SPOTIFY_CLIENT_ID=...
  #     SPOTIFY_CLIENT_SECRET=...
  # Env vars win over anything set here. Without them, name lookups fall back
  # to opening Spotify's search page for the query.
  client_id: ""
  client_secret: ""

  # ISO country code used to relink search results to a playable version.
  market: "US"

  # Launch the desktop client automatically when a music command arrives and
  # Spotify isn't already on the session bus.
  autostart: true
  launch_command: "spotify"

commands:
  require_confirmation_for:
    - "delete_file"
    - "shutdown"
    - "close_all_apps"

logging:
  level: "DEBUG"
  file: "nora.log"

ambient:
  # Set to true to run a background mic loop that captures everything you say
  # (not just NORA commands) into the personal knowledge base.
  # Requires WASAPI shared-mode mic (default on Windows) — safe to enable.
  enabled: false
  sample_rate: 16000
  chunk_sec: 5.0

vision:
  # Camera + face recognition. Opt-in, like ambient — nothing opens the
  # camera until this is true and the perception loop is started.
  # Deps: opencv-python, insightface, onnxruntime (buffalo_l pack ~300 MB on first run).
  enabled: false
  camera_index: 0
  fps: 5                    # detection rate; embedding is event-driven, not per-frame
  face:
    enabled: true
    match_threshold: 0.5    # cosine similarity; tune on real captures
    greet_on_first_sight: true
    regreet_after_seconds: 1800   # re-greet once absent this long; 0 = once per process
    offer_enrollment_for_unknown: false
    persist_unknown_embeddings: false   # keep false — unknown faces must leave no trace
    owner: ""               # whose face is the owner's; overrides the stored flag.
                            # Leave empty to designate by voice ("you're the owner").
  detector_device: "cpu"    # "cuda" | "cpu" — falls back to CPU if onnxruntime has no CUDA provider

  guest_mode:
    # When someone who is NOT the owner is in front of the camera, the actions
    # below decline instead of reading private things into the room. This can
    # only ever take capability away: seeing the owner never unlocks anything,
    # because a face is defeated by a printed photograph.
    #
    # With no owner designated (face.owner empty and nobody marked trusted),
    # only UNRECOGNIZED faces count as guests — enrolling a face does not lock
    # you out of your own memory recall.
    enabled: true
    decline: "Someone I don't recognize is here, so I'll keep that private. Ask me again when you're alone."
    restricted_actions:     # delete an entry to let it run with a guest present
      - recall
      - semantic_recall
      - show_patterns
      - memory_status
      - inject_knowledge
      - check_email
      - send_email
      - check_calendar
      - add_calendar_event
      - delete_calendar_event
      - read_screen         # reads whatever is on screen out loud
      - set_owner           # a guest must not be able to promote themselves
    restricted_categories: []   # e.g. [memory] to withhold a whole command category

cognitive_memory:
  # ChromaDB persistent store for semantic + episodic memory.
  # Embedder: all-MiniLM-L6-v2 (~80 MB download on first run).
  # Set embedder_device to "cpu" if no GPU or if startup is slow.
  embedder_device: "cuda"          # "cuda" | "cpu"
  embedder_model: "all-MiniLM-L6-v2"

proactive:
  # Proactive intelligence engine — suggests actions based on learned patterns.
  enabled: true
  idle_threshold_sec: 120          # Seconds of silence before proactive trigger
  suggestion_cooldown_sec: 1800    # Minimum gap between proactive suggestions
  min_pattern_confidence: 5        # Min times a pattern must be seen before suggesting

user_model:
  # Versioned learned preferences (CODEX_INTEGRATION.md 2.5). A proposed
  # change is held for review, not applied silently.
  preference_auto_apply_hours: 24  # Auto-apply a pending preference change after this long; 0 = apply immediately

autonomy:
  # Autonomy tiering + risk aggregation + trust ledgers (see CODEX_INTEGRATION.md).
  # This layer can only ADD confirmation prompts on its own. Set
  # allow_consent_skip: true to let NORA stop asking about action classes you
  # always approve — never applies to high-risk or destructive actions.
  enabled: true
  allow_consent_skip: false
  unproven_min_runs: 5             # Clean runs before a tool counts as proven
  session_reversal_limit: 3        # Undos per session before a class must always confirm
  consent_half_life_days: 30       # Decay: a month-old "yes" counts half a fresh one

confidence:
  # Verification loop (CODEX_INTEGRATION.md 2.6/5.11) — heuristic confidence
  # over a parsed intent. Below this, NORA confirms instead of guessing.
  clarify_below: 0.4

focus:
  # Attention model — when to speak, not just what to say (PipeWire-based).
  # On a call: proactive speech is held. Media playing: deferred. Away: queued.
  # Degrades to "available" on non-Linux or without pw-dump.
  enabled: true
  away_after_sec: 600              # Seconds without a command before you count as away

silent_hours:
  # Learned quiet windows (CODEX_INTEGRATION.md 5.6) — derived from the
  # activity heatmap, not set by hand. Gates proactive speech alongside focus.
  enabled: true
  min_history_bins: 20             # Total logged actions needed before a pattern is trusted
  quiet_threshold_frac: 0.03       # A time bin at/below this share of all activity counts as quiet

timeouts:
  transcribe_sec: 30               # Max seconds for Whisper transcription before giving up
  llm_sec: 45                      # Max seconds for LLM intent parsing before giving up
  command_sec: 45                  # Max seconds per command step execution

security:
  # Actions that are NEVER allowed regardless of what the LLM decides.
  blocked_actions: []
  # Actions that ALWAYS require voice confirmation, even if the LLM didn't flag them.
  destructive_actions:
    - delete_file
    - shutdown
    - close_all_apps
    - lock_screen
    - forget_face
    - forget_all_faces
    - set_owner

neurosym:
  # NeuroSym-AI guardrail settings.
  # input_guard: blocks adversarial voice commands before they reach the LLM.
  # action_guard: validates parsed action plans before execution.
  enabled: true
  # Severity threshold for the input guard. Inputs at or above this are blocked.
  # Options: info | low | medium | high | critical
  input_deny_above: "high"
  # Maximum number of steps the LLM is allowed to plan in a single command.
  max_plan_steps: 15

plugins:
  enabled: true
  dir: "./plugins"                  # Drop .py files here; @register handlers auto-load

# ── Sprint 1: Feel (Perception Layer) ─────────────────────────────────────

barge_in:
  # Suppress TTS mid-sentence when the user starts speaking.
  # threshold_rms: mic level required to count as speech (0.0–1.0).
  # delay_sec: seconds to wait after TTS starts before monitoring mic (avoids echo).
  enabled: true
  threshold_rms: 0.06
  delay_sec: 0.35

wakeword:
  # Always-on wakeword detection via openWakeWord.
  # Requires: pip install openwakeword
  # Primary activation mode — PTT key/button still works as a secondary fallback.
  #
  # model: either a pretrained id that ships inside the openwakeword wheel
  # (alexa_v0.1, hey_jarvis_v0.1, hey_mycroft_v0.1, hey_rhasspy_v0.1) or a path
  # to a custom-trained .onnx. Paths may use ~ and may be relative to the
  # project root. A list loads several at once — every model is scored on the
  # same frame, so a second phrasing costs one more small matmul, not a second
  # mic stream:
  #
  #   model:
  #     - "models/wakeword/hey_nora.onnx"
  #     - "models/wakeword/hi_nora.onnx"
  #
  # models/wakeword/hey_nora.onnx is trained here (see training/wakeword/) and
  # covers both "hey nora" and "hi nora" — one model, both phrasings, so the
  # list form above is not needed.
  #
  # sensitivity: 0.0–1.0. This is the raw score a frame must reach, so lower
  # is more sensitive and more false triggers. 0.9 is not a timid setting here:
  # on 152 clips across 8 accents it wakes on 91.7% of real utterances while
  # firing on 1.6% of the near-misses that used to break this ("hey dora",
  # "hey laura", "aurora"). Dropping to 0.5 buys no extra wakes and multiplies
  # the collisions — raise it, do not lower it, if she wakes to the wrong name.
  # A bare "nora" mid-sentence stays below 0.9 by design.
  # cooldown_sec: minimum gap between consecutive triggers.
  #
  # input_device: which microphone to listen on. Unset means the system default.
  # That is usually right and was not right here — this machine's default source
  # is an ACP digital mic emitting a DC-offset rumble with no energy above 4 kHz
  # (measured: 99.9% of its energy below 150 Hz), so the detector ran for hours
  # and could not have fired once.
  #
  # Setting this is the second choice, not the first. It takes a sounddevice
  # index or a case-insensitive substring of the name sounddevice reports, NOT
  # the name `wpctl status` prints — and on a PipeWire desktop the only devices
  # with distinct names are the raw ALSA ones, which run at the card's rate and
  # may refuse the 16 kHz the detector opens. That is the case on this machine:
  # hw:2,0 matches `ALC245` and then fails to open, so there is no value here
  # that reaches the good microphone. A device that cannot capture 16 kHz mono
  # is rejected at startup with a logged reason and the default is used instead.
  #
  # The fix that works here is to move PipeWire's default instead, which also
  # fixes every other app rather than just this one:
  #
  #     training/wakeword/mic_probe.py --scan     # names the mic that hears you
  #     wpctl set-default <id>                    # point everything at it
  enabled: true
  model: "models/wakeword/hey_nora.onnx"
  sensitivity: 0.9
  cooldown_sec: 1.5
  input_device: null

# ── Sprint 2: Know (Durable Cognition) ────────────────────────────────────────

session_briefing:
  # Deliver a spoken summary on first wake of a new session (gap >4h or new day).
  enabled: true

consolidation:
  # Nightly consolidation job — runs once per day at run_hour:run_minute.
  # Produces nora_daily_brief.json and stores a ChromaDB knowledge entry.
  enabled: true
  run_hour: 23
  run_minute: 0

task_ledger:
  # Persistent store for open/closed tasks (nora_tasks.json at project root).
  enabled: true

# ── Sprint 3: Dev Mode (Voice-Native Developer Tools) ─────────────────────────

terminal_monitor:
  # Clipboard watcher — alerts when copied text looks like a stack trace.
  enabled: true

repo_context:
  # Repo-Aware Context Pack — auto-injected into system prompt.
  # cache_ttl_sec: how long to cache git metadata between LLM calls.
  enabled: true
  cache_ttl_sec: 30

# ── Sprint 4: Autonomous Planning & Trust ────────────────────────────────────

anomaly_watchdog:
  # Background system metrics monitor — speaks alert when threshold is crossed.
  # Requires: pip install psutil  (pynvml optional for GPU metrics)
  enabled: true
  poll_sec: 30                   # How often to poll (seconds)
  cpu_percent: 90                # Alert when CPU sustained above this %
  ram_percent: 90                # Alert when RAM usage above this %
  gpu_percent: 94                # Alert when GPU utilization above this %
  gpu_vram_percent: 90           # Alert when GPU VRAM above this %
  disk_write_mbps: 500           # Alert when disk write throughput above this MB/s

planner:
  # ReAct autonomous planner — observe → decide → act → verify loop.
  # Activated when the user's utterance matches is_autonomous_task() heuristic.
  enabled: true

workflows:
  # Dynamic workflow recording & replay.
  # save_workflow(name) snapshots recent session turns as a named macro.
  # run_workflow(name) replays the macro via command_engine.
  enabled: true

audit_log:
  # Structured JSON-lines log of every action NORA takes.
  # Stored at nora_audit_log.jsonl in the project root.
  enabled: true

reversible_actions:
  # Record compensating inverses for state-changing actions.
  # Voice: "undo the last thing you did" / "undo everything you did this morning"
  # "undo the rename batch" (bundle tag) / "what would undo do?" (preview)
  enabled: true
  announce_window_sec: 30   # Time-boxed undo window quoted in format_undo_announcement()

# ── Remote Mic (Mac → Windows bridge) ────────────────────────────────────────
remote_mic:
  # Accept microphone audio from a remote machine (e.g. a MacBook).
  # Set enabled: true, then run nora_remote.py on the Mac:
  #   python nora_remote.py --host <THIS_WINDOWS_IP> [--ptt]
  # Find your Windows IP: run `ipconfig` in PowerShell → IPv4 Address (Wi-Fi).
  # Windows Firewall: allow inbound TCP on the port below.
  enabled: true
  host: "0.0.0.0"    # bind to all interfaces so the Mac can reach it
  port: 8767

screen_intelligence:
  # Vision model for read_screen / find_on_screen / click_on. Groq retired
  # meta-llama/llama-4-scout-17b-16e-instruct (404 as of 2026-08-19) and
  # qwen/qwen3.6-27b is the only vision model left on the platform.
  # It is a reasoning model — see the notes in screen_intelligence.py before
  # lowering max_tokens or turning on reasoning_format.
  vision_model: "qwen/qwen3.6-27b"

web_search:
  # tell_me_about() — the spoken research answer. Three tiers, tried in order:
  #   1. live_search  — groq/compound-mini searches the web itself (current data)
  #   2. snippets     — Brave (needs BRAVE_API_KEY) or DuckDuckGo Lite, then
  #                     summarised by the llm_router "research" role
  #   3. model only   — last resort, and it says so out loud
  # Today's date is injected into every prompt; without it the model answers
  # "right now" questions from its training cutoff and sounds confidently stale.
  live_search: true
  max_snippets: 5
  live_tokens: 180          # keep small — see the live_search notes in llm_router
  summary_tokens: 400       # tiers 2/3; gpt-oss bills hidden reasoning against this
  max_sentences: 3          # spoken answer + one caveat sentence
  freshness_days: 7         # Brave freshness filter for "today"/"now"/"latest" queries

weather:
  # get_weather() reads the same keyless Open-Meteo API the dashboard widget
  # polls, so the spoken answer and the on-screen widget can never disagree.
  # Leave `home` blank to locate by IP (ipapi.co, then ipwho.is); set it to a
  # city name if you're behind a VPN, where IP geolocation lands in the wrong
  # country. An explicit "weather in <place>" always overrides this.
  home: ""

multimodal_context:
  # Pre-attach active window title + OCR screen snippet to ambiguous commands.
  # Only fires for commands containing deictic words ("this", "that", "here", etc.)
  enabled: true

# ── Sprint 5: Ecosystem Expansion ─────────────────────────────────────────────

mcp_servers:
  - name: playwright
    transport: stdio
    command: ["npx", "@playwright/mcp@latest"]

  - name: github
    transport: stdio
    command: ["npx", "@modelcontextprotocol/server-github@latest"]
    # GITHUB_TOKEN is inherited automatically from .env

  - name: memory
    transport: stdio
    command: ["npx", "@modelcontextprotocol/server-memory@latest"]

  - name: brave_search
    transport: stdio
    command: ["npx", "@modelcontextprotocol/server-brave-search@latest"]
    # Requires BRAVE_API_KEY in .env — free at brave.com/search/api

  - name: fetch
    transport: stdio
    command: ["uvx", "mcp-server-fetch"]

  - name: arxiv
    transport: stdio
    command: ["python", "mcp_servers/arxiv_server.py"]
    # Built with mcpforge — search_arxiv(query), get_arxiv_paper(arxiv_id).
    # No API key needed, public arXiv API.

  - name: obsidian
    transport: stdio
    command: ["npx", "mcp-obsidian", "C:/path/to/your/vault"]
    # 1. Replace path with your actual Obsidian vault path (use forward slashes)
    # 2. Install "Local REST API" community plugin in Obsidian
    # 3. Add OBSIDIAN_API_KEY from plugin settings to .env

  # --- Odysseus (NORA_ODYSSEUS_PLAN.md, Direction B) ---
  # Odysseus's own MCP servers, run from a dedicated venv (not Odysseus's Docker
  # container — nothing there can reach a stdio child process NORA spawns).
  # Both entries below default ODYSSEUS_DATA_DIR to <odysseus repo>/data, which
  # is the same path Odysseus's docker-compose.yml mounts by default
  # (${APP_DATA_DIR:-./data}) — so this reads/writes the same store a Docker
  # deployment would, no divergent copies. Verified working 2026-08-12: tools
  # register and round-trip real add/list calls.
  - name: odysseus_memory
    transport: stdio
    command: ["/home/aadit/Projects/odysseus/venv/bin/python", "-m", "mcp_servers.memory_server"]
    cwd: "/home/aadit/Projects/odysseus"
    # Registers mcp_odysseus_memory_manage_memory(action, text, memory_id, category).
    # If your Odysseus memory entries are owner-scoped, uncomment and set:
    # env:
    #   ODYSSEUS_MCP_MEMORY_OWNER: "your_owner_id"

  - name: odysseus_rag
    transport: stdio
    command: ["/home/aadit/Projects/odysseus/venv/bin/python", "-m", "mcp_servers.rag_server"]
    cwd: "/home/aadit/Projects/odysseus"
    # Registers mcp_odysseus_rag_manage_rag(action, directory) —
    # list / add_directory / remove_directory over Odysseus's RAG index.
    # Vector search quality depends on Odysseus's embedding deps being
    # installed in venv/ — falls back gracefully (e.g. "not indexed") if not.

  # odysseus_email intentionally omitted: email_server.py talks to a live
  # Dovecot IMAP instance that isn't deployed in this environment yet. Add it
  # once Odysseus's Docker stack (or at least Dovecot) is actually running —
  # see NORA_ODYSSEUS_PLAN.md §4.2.

websocket_api:
  # Authenticated WebSocket API for mobile PTT, typed commands, and push notifications.
  # Clients connect to ws://<host>:<port>
  # Set NORA_API_TOKEN in .env to require token auth; leave unset for localhost-only access.
  # Install dependency: pip install websockets
  enabled: true
  host: "0.0.0.0"
  port: 8765
  # Mirror spoken replies to connected clients as MP3 chunks, so a phone on the
  # tailnet hears NORA at the same time the laptop speaks. Local playback is
  # unaffected either way. Tap "TAP FOR AUDIO" once per session on the phone --
  # browsers refuse programmatic playback without a user gesture first.
  relay_audio: true

persona:
  # Persona Calibration — voice-tunable communication style.
  # Settings are stored in nora_persona.json and applied to every response.
  # Voice: "be more concise", "use a casual tone", "reset your persona"
  enabled: true

# ── Ported from Hermes Agent (2026-08-29) ────────────────────────────────────

skills:
  # Procedural memory as Markdown (agentskills.io SKILL.md format). Only each
  # skill's name and description reach the intent-parser prompt; the body is
  # read off disk after the model picks one, so a large library costs a short
  # list rather than a long one.
  #
  # `~/.nora/skills` is where `save_skill` writes. `.agents/skills` is shared
  # with Claude Code — drop it from this list if its design/review skills are
  # noise in the voice catalogue.
  dirs:
    - "~/.nora/skills"
    - ".agents/skills"

telegram:
  # Reach NORA when you're not at the machine. Text or a voice memo — memos go
  # through the same Whisper model as the microphone.
  #
  # Setup: talk to @BotFather to make a bot, put the token in .env as
  # TELEGRAM_BOT_TOKEN, then message the bot once — it replies with the chat id
  # to paste below.
  #
  # allowed_chat_ids is a hard allowlist and an empty one refuses to start:
  # a bot token is a bearer credential, and the process behind it can drive
  # the desktop. Anything the security policy wants confirmed is refused over
  # Telegram regardless of this list — those stay in the room.
  enabled: false
  token_env: "TELEGRAM_BOT_TOKEN"
  allowed_chat_ids: []
